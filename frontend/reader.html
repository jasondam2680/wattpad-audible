<!DOCTYPE html>
<html lang="vi" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đọc chi tiết chương - Wattpad AI Audiobook</title>
  
  <meta name="theme-color" content="#060913">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="reader-body min-h-screen flex flex-col text-slate-100 selection:bg-indigo-500 selection:text-white relative font-sans">

  <!-- AMBIENT LIQUID ORBS BACKGROUND -->
  <div class="liquid-ambient-container" aria-hidden="true">
    <div class="liquid-orb orb-1"></div>
    <div class="liquid-orb orb-2"></div>
    <div class="liquid-orb orb-3"></div>
    <div class="liquid-mesh-grid"></div>
  </div>

  <!-- READER TOPBAR NAVIGATION (Sticky) -->
  <header class="reader-header sticky top-0 z-40 bg-slate-950/60 backdrop-blur-2xl border-b border-white/10 shadow-lg shadow-black/30">
    <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
      
      <!-- Left: Back / Close & Story Title -->
      <div class="flex items-center space-x-3 min-w-0 flex-1">
        <button id="btn-reader-close" class="p-2 rounded-xl liquid-btn-secondary text-slate-300 hover:text-white transition shrink-0" title="Đóng cửa sổ đọc">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
        
        <div class="min-w-0">
          <h1 id="reader-story-title" class="text-xs text-slate-400 font-medium truncate">Đang tải truyện...</h1>
          <h2 id="reader-chapter-title-top" class="text-xs sm:text-sm font-bold text-white truncate">Chương...</h2>
        </div>
      </div>

      <!-- Center: Chapter Switcher (< Selector >) -->
      <div class="hidden md:flex items-center space-x-1.5 shrink-0">
        <button id="btn-top-prev-chapter" class="p-1.5 rounded-xl liquid-btn-secondary text-slate-300 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed transition" title="Chương trước">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>

        <select id="select-top-chapter" class="px-2.5 py-1.5 rounded-xl text-xs bg-black/40 border border-white/15 text-white max-w-[200px] truncate focus:outline-none cursor-pointer">
          <option value="">Đang tải danh sách...</option>
        </select>

        <button id="btn-top-next-chapter" class="p-1.5 rounded-xl liquid-btn-secondary text-slate-300 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed transition" title="Chương sau">
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Right: Action Buttons & Reading Preferences -->
      <div class="flex items-center space-x-2 shrink-0">
        
        <!-- Yêu thích chương -->
        <button id="btn-toggle-fav-chapter" class="p-2 rounded-xl liquid-btn-secondary text-slate-300 hover:text-rose-400 transition" title="Đánh dấu chương yêu thích">
          <i data-lucide="heart" id="icon-fav-chapter" class="w-4 h-4"></i>
        </button>

        <!-- Trạng thái Audio / Nghe Audio -->
        <div id="reader-audio-badge-container">
          <!-- Populated dynamically -->
        </div>

        <!-- Mở bảng cài đặt hiển thị (Font, Size, Theme) -->
        <div class="relative">
          <button id="btn-toggle-settings" class="p-2 rounded-xl liquid-btn-secondary text-slate-300 hover:text-white transition" title="Cài đặt cỡ chữ & nền">
            <i data-lucide="type" class="w-4 h-4"></i>
          </button>

          <!-- Settings Dropdown Panel -->
          <div id="reader-settings-panel" class="hidden absolute right-0 mt-2 w-64 glass-card p-4 rounded-2xl shadow-2xl z-50 space-y-3.5 border-white/20">
            <!-- Font Size -->
            <div>
              <span class="text-xs font-semibold text-slate-300 block mb-1.5">Cỡ chữ:</span>
              <div class="flex items-center justify-between bg-black/40 rounded-xl p-1 border border-white/10">
                <button id="btn-font-dec" class="px-3 py-1 rounded-lg text-xs font-bold hover:bg-white/10 transition">A-</button>
                <span id="label-font-size" class="text-xs font-mono text-cyan-300">18px</span>
                <button id="btn-font-inc" class="px-3 py-1 rounded-lg text-xs font-bold hover:bg-white/10 transition">A+</button>
              </div>
            </div>

            <!-- Font Family -->
            <div>
              <span class="text-xs font-semibold text-slate-300 block mb-1.5">Kiểu chữ:</span>
              <div class="grid grid-cols-2 gap-1.5 bg-black/40 rounded-xl p-1 border border-white/10">
                <button id="btn-font-sans" class="px-2 py-1 rounded-lg text-xs font-sans hover:bg-white/10 active-font-opt transition">Không chân</button>
                <button id="btn-font-serif" class="px-2 py-1 rounded-lg text-xs font-serif hover:bg-white/10 transition">Có chân</button>
              </div>
            </div>

            <!-- Reader Theme -->
            <div>
              <span class="text-xs font-semibold text-slate-300 block mb-1.5">Màu nền đọc:</span>
              <div class="grid grid-cols-3 gap-1.5">
                <button id="btn-theme-dark" class="px-2 py-1.5 rounded-xl text-xs font-medium bg-slate-900 text-slate-200 border border-indigo-500/50 shadow-sm transition">Tối</button>
                <button id="btn-theme-sepia" class="px-2 py-1.5 rounded-xl text-xs font-medium bg-[#fbf0d9] text-[#5f4b32] border border-amber-300/40 transition">Sepia</button>
                <button id="btn-theme-light" class="px-2 py-1.5 rounded-xl text-xs font-medium bg-slate-100 text-slate-900 border border-slate-300 transition">Sáng</button>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </header>

  <!-- MAIN READING CONTAINER -->
  <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-8 space-y-6">
    
    <!-- LOADING STATE -->
    <div id="reader-loading-state" class="py-20 text-center space-y-4">
      <div class="w-12 h-12 mx-auto border-3 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm text-slate-300 font-medium">Đang tải nội dung chương truyện...</p>
    </div>

    <!-- ERROR STATE -->
    <div id="reader-error-state" class="hidden glass-card rounded-3xl p-8 text-center space-y-4 max-w-md mx-auto">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-rose-500/20 border border-rose-500/30 flex items-center justify-center text-rose-300">
        <i data-lucide="alert-circle" class="w-7 h-7"></i>
      </div>
      <h3 class="font-bold text-white text-base">Không thể tải nội dung</h3>
      <p id="reader-error-msg" class="text-xs text-slate-300/80">Có lỗi xảy ra khi lấy nội dung chương từ Wattpad.</p>
      <button id="btn-reader-retry" class="px-5 py-2.5 rounded-2xl liquid-btn-primary text-white text-xs font-semibold">
        Thử lại
      </button>
    </div>

    <!-- ARTICLE CONTENT AREA -->
    <article id="reader-content-card" class="hidden glass-card rounded-3xl p-6 sm:p-10 space-y-6 transition-all">
      
      <!-- Chapter Meta Header -->
      <div class="border-b border-white/10 pb-6 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400">
          <span id="reader-meta-story-title" class="font-medium text-cyan-300 flex items-center space-x-1">
            <i data-lucide="book" class="w-3.5 h-3.5"></i>
            <span>Wattpad Story</span>
          </span>
          <div class="flex items-center space-x-3">
            <span id="reader-word-count" class="flex items-center space-x-1">
              <i data-lucide="file-text" class="w-3.5 h-3.5 text-indigo-400"></i>
              <span>0 từ</span>
            </span>
            <span id="reader-read-time" class="flex items-center space-x-1">
              <i data-lucide="clock" class="w-3.5 h-3.5 text-pink-400"></i>
              <span>~1 phút đọc</span>
            </span>
          </div>
        </div>

        <h1 id="reader-chapter-title" class="font-bold text-xl sm:text-2xl sm:leading-relaxed text-white">
          Tiêu đề chương
        </h1>

        <!-- Inline Audio Banner if available or not -->
        <div id="reader-inline-audio-box" class="pt-2"></div>

        <!-- Bilingual Switcher (Tiếng Việt / Văn bản gốc) -->
        <div id="reader-bilingual-switcher" class="hidden flex items-center justify-between gap-2 p-2 rounded-2xl bg-black/40 border border-white/10">
          <div class="flex items-center space-x-1.5">
            <button id="btn-reader-view-vi" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600/80 text-white shadow-sm transition">
              <i data-lucide="sparkles" class="w-3.5 h-3.5 inline mr-1 text-amber-300"></i> Bản dịch tiếng Việt
            </button>
            <button id="btn-reader-view-orig" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition">
              <i data-lucide="languages" class="w-3.5 h-3.5 inline mr-1"></i> Văn bản gốc (<span id="reader-orig-lang-label">EN</span>)
            </button>
          </div>
          <span id="reader-translation-cached-badge" class="hidden text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
            Neural AI Translated
          </span>
        </div>
      </div>

      <!-- Chapter Body Text -->
      <div id="reader-body-text" class="reader-text-container leading-relaxed space-y-5 text-slate-200 text-justify">
        <!-- Content inserted dynamically -->
      </div>

      <!-- Navigation & Action Footer -->
      <div class="border-t border-white/10 pt-8 mt-10 flex flex-col sm:flex-row items-center justify-between gap-4">
        <button id="btn-bottom-prev" class="w-full sm:w-auto px-5 py-3 rounded-2xl liquid-btn-secondary text-xs font-semibold text-slate-200 flex items-center justify-center space-x-2 transition disabled:opacity-40 disabled:cursor-not-allowed">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>Chương trước</span>
        </button>

        <button id="btn-bottom-prompt-audio" class="w-full sm:w-auto px-6 py-3 rounded-2xl liquid-btn-primary text-xs font-bold text-white flex items-center justify-center space-x-2 shadow-lg shadow-indigo-500/30 transition">
          <i data-lucide="sparkles" class="w-4 h-4 text-amber-300"></i>
          <span id="btn-bottom-audio-label">Tạo Sách nói AI cho chương này</span>
        </button>

        <button id="btn-bottom-next" class="w-full sm:w-auto px-5 py-3 rounded-2xl liquid-btn-secondary text-xs font-semibold text-slate-200 flex items-center justify-center space-x-2 transition disabled:opacity-40 disabled:cursor-not-allowed">
          <span>Chương tiếp theo</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </div>

    </article>

  </main>

  <!-- Audio player for in-reader listening if user wants to play directly -->
  <audio id="reader-audio-player" class="hidden"></audio>

  <!-- Reader logic JS -->
  <script src="/static/js/reader.js"></script>
</body>
</html>
